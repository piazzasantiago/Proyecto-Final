# nginx de AviGest: sirve el frontend y hace de proxy hacia el backend.
# Dominio principal: avigest.com.ar (si eligen otro, reemplazarlo en todo el archivo).

upstream backend {
    server backend:8000;
}

# --- HTTP --------------------------------------------------------------------
# Solo atiende el desafío de Let's Encrypt; todo lo demás va a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name avigest.com.ar www.avigest.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://avigest.com.ar$request_uri;
    }
}

# --- HTTPS: www -> sin www ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.avigest.com.ar;

    ssl_certificate     /etc/letsencrypt/live/avigest.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avigest.com.ar/privkey.pem;

    return 301 https://avigest.com.ar$request_uri;
}

# --- HTTPS: el sistema -------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name avigest.com.ar;

    ssl_certificate     /etc/letsencrypt/live/avigest.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avigest.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    # Capa de lógica: API REST y admin de Django.
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Los informes en PDF/Excel pueden tardar unos segundos.
        proxy_read_timeout 120s;
    }

    # Estáticos del admin, generados por collectstatic.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }

    # Archivos del build de Vite: llevan un hash en el nombre, se cachean un año.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # index.html nunca se cachea, así cada deploy se ve al instante.
    location = /index.html {
        expires -1;
    }

    # SPA: cualquier otra ruta (/login, /app/lotes...) la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
