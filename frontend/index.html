    <script>
      // Tema claro/oscuro antes del primer dibujo (ver src/components/useTema.js).
      (function () {
        var tema = null;
        try { tema = localStorage.getItem("avigest-tema"); } catch (e) {}
        if (tema !== "dark" && tema !== "light") {
          tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", tema);
      })();
    </script>
    <title>AvíGest · Gestión Avícola</title>
    <meta name="description" content="Sistema web de gestión para una granja avícola productora de huevos." />
