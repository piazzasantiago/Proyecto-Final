<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Favicon de AvíGest: huevo sobre fondo dorado, igual que el logo-mark
       de la barra lateral y del login. -->
  <defs>
    <linearGradient id="dorado" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#EEC568"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="64" height="64" rx="16" fill="url(#dorado)"/>

  <!-- Huevo: elipse levemente más angosta arriba, como el ícono fa-egg -->
  <path
    fill="#1B4A34"
    d="M32 13c-7.2 0-13 10.2-13 20.1C19 42.9 24.8 51 32 51s13-8.1 13-17.9C45 23.2 39.2 13 32 13z"/>

  <!-- Brillo -->
  <ellipse cx="27" cy="27" rx="3.4" ry="5" fill="#FFFFFF" opacity="0.22"/>
</svg>
