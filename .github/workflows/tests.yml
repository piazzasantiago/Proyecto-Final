# Workflow: Tests del Backend
#
# Se ejecuta en CUALQUIER push a CUALQUIER rama, y al abrir o actualizar
# un Pull Request hacia `develop` o `main`.
#
# Por qué en todas las ramas:
#   El desarrollo ocurre en ramas `feature/*` y `fix/*`. Detectar un error
#   en esa rama, mientras se está trabajando, es mucho más barato que
#   detectarlo recién al abrir el PR. Si el test falla en la feature, el
#   desarrollador lo sabe de inmediato y lo corrige antes de mergear.
#
# La protección de `develop` y `main` (merge bloqueado si el CI falla)
# se configura en GitHub: Settings → Branches → Branch protection rules.
#
# Qué hace:
#   1. Levanta PostgreSQL como servicio Docker.
#   2. Instala las dependencias del backend.
#   3. Corre todos los tests de Django (todas las apps).
#   4. Reporta si pasaron o fallaron.

name: Tests del Backend

on:
  # Corre en cualquier push, sin importar la rama.
  push:

  # Corre cuando se abre o actualiza un PR hacia develop o main.
  # Esto da un check verde/rojo visible en el PR antes de mergear.
  pull_request:
    branches: [develop, main]

jobs:
  tests:
    name: Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: granja_avicola_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Instalar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Crear archivo .env
        working-directory: backend
        run: |
          cat > .env << EOF
          DJANGO_SECRET_KEY=clave-de-ci-no-usar-en-produccion
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          DB_NAME=granja_avicola_test
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          EOF

      - name: Verificar configuración de Django
        working-directory: backend
        run: python manage.py check

      - name: Aplicar migraciones
        working-directory: backend
        run: python manage.py migrate

      - name: Correr tests
        working-directory: backend
        run: python manage.py test --verbosity=2
